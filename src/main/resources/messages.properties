about.title=About MovieFinder
about.lead=MovieFinder is a theme-based movie search engine. Enter any keyword you are interested in, and even without knowing a single movie title, you can explore movie websites about that theme and discover more films worth watching.
about.how.title=How search and ranking work
about.how.lead=MovieFinder does more than list search results. It re-ranks the websites with its own keyword scoring, so the results better match what you are looking for.
about.how.step1.label=Theme search
about.how.step1=Combine your keywords with movie-related terms and get candidate websites from the Tavily Search API.
about.how.step2.label=Website analysis
about.how.step2=Fetch each website's main page and up to five of its direct subpages, and build them into a website tree (WebTree).
about.how.step3.label=Keyword scoring
about.how.step3=Count how often each keyword appears on every page, and score the page using a weight for each keyword.
about.how.step4.label=Website total
about.how.step4=Add scores up from the bottom of the tree: 50% of the subpage scores count toward the main page's total.
about.how.step5.label=Sorting
about.how.step5=Sort the results by total website score, from highest to lowest, with QuickSort.
about.source.title=Data source
about.source.body=MovieFinder gets candidate websites from the Tavily Search API, then analyses page content and subpage links and re-ranks them with its own scoring algorithm.
about.source.note=Google's Custom Search JSON API no longer accepts new users, so following the course's recommendation, this project uses Tavily as its search data source.
