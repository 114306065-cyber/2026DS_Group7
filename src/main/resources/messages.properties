about.title=About MovieFinder
about.lead=MovieFinder is a theme-based movie search engine. Enter a topic such as cat, cooking, or friendship, and it finds movie-related websites about that theme, even if you do not know any movie titles.
about.how.title=How ranking works
about.how.step1=Expand your query with movie terms and search Tavily for candidate websites.
about.how.step2=Crawl each website and up to five of its subpages into a tree.
about.how.step3=Count keywords on every page and score it: count × weight for each keyword.
about.how.step4=Add half of the subpage scores to each parent, from the bottom of the tree up.
about.how.step5=Sort the websites by total score with QuickSort.
about.source.title=Data source
about.source.body=Search results come from the Tavily Search API. Google stopped offering its search API to new users in 2026, so the course uses Tavily instead.
about.team.title=Team
about.team.body=Group 7, Data Structures, National Chengchi University, Fall 2026.
