spring.application.name=MovieFinder
# Cloud hosts usually inject PORT; locally this falls back to 8080.
server.port=${PORT:8080}

# Read the key from the TAVILY_API_KEY environment variable. Do not paste it here.
tavily.api-key=${TAVILY_API_KEY:}
tavily.max-results=10

crawler.max-links=5

# UI text lives in messages*.properties. Without this, an English request on a
# Chinese computer would fall back to the system language.
spring.messages.fallback-to-system-locale=false
