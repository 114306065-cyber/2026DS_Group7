<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:text="${title}">MovieFinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&family=Playfair+Display:wght@600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<a th:fragment="logo" class="logo" th:href="@{/}"><span class="logo-icon" aria-hidden="true">🎬</span>MovieFinder</a>

<form th:fragment="searchForm" class="search" th:action="@{/search}" method="get" role="search">
    <label class="sr-only" for="q" th:text="#{search.label}">Search movies by theme</label>
    <input id="q" type="search" name="q" th:value="${q}" th:placeholder="#{search.placeholder}" autocomplete="off" required>
    <button type="submit" th:text="#{search.button}">Search</button>
</form>

<!-- path is the current page; the link keeps the query and flips the language. -->
<a th:fragment="langToggle(path)" class="lang-toggle"
   th:with="other=${#locale.language == 'zh'} ? 'en' : 'zh'"
   th:href="${q == null} ? @{${path}(lang=${other})} : @{${path}(q=${q},lang=${other})}"
   th:title="#{lang.aria}" th:attr="aria-label=#{lang.aria}">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
    </svg>
    <span th:text="#{lang.switch}">中文</span>
</a>

</body>
</html>
