<!DOCTYPE html>
<html th:lang="${#locale.language == 'zh'} ? 'zh-Hant' : 'en'" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('MovieFinder')}"></head>
<body class="page-home">
    <header th:replace="~{fragments :: siteHeader('/', 'search')}"></header>

    <main>
        <section class="hero">
            <img class="decor decor-left" th:src="@{/images/decor/facade-light.webp}" src="/images/decor/facade-light.webp" alt="" loading="lazy" decoding="async">
            <img class="decor decor-right" th:src="@{/images/decor/banner-light.webp}" src="/images/decor/banner-light.webp" alt="" loading="lazy" decoding="async">
            <img class="decor decor-strip" th:src="@{/images/decor/strip-dark.webp}" src="/images/decor/strip-dark.webp" alt="" loading="lazy" decoding="async">

            <div class="hero-inner">
                <img class="film-ribbon" th:src="@{/images/decor/ribbon-light.webp}" src="/images/decor/ribbon-light.webp" alt="" loading="lazy" decoding="async">
                <h1 class="hero-title">MovieFinder</h1>
                <p class="hero-tagline"><span th:text="#{home.tagline}">Find movies by the themes you love</span></p>
                <form th:replace="~{fragments :: searchForm('/search')}"></form>
                <p class="hero-hint" th:text="#{home.hint}">Search for a theme, topic, mood, or any idea you are interested in.</p>
                <div class="hero-compare">
                    <a th:replace="~{fragments :: compareLink(#{home.compare})}"></a>
                    <span class="hero-compare-note" th:text="#{home.compareNote}">See how MovieFinder ranks results differently from Tavily.</span>
                </div>
            </div>
        </section>

        <section class="themes" aria-labelledby="themes-title">
            <div class="section-head">
                <h2 id="themes-title" th:text="#{explore.title}">Explore by Theme</h2>
                <p th:text="#{explore.subtitle}">Try one of these popular themes to discover movies.</p>
            </div>
            <ul class="theme-grid">
                <li th:each="t : ${ {'animals','cooking','friendship','ai','romance','adventure'} }">
                    <a class="theme-card" th:classappend="'theme-' + ${t}" th:href="@{/search(q=${t == 'ai' ? 'AI' : t})}">
                        <span class="theme-name" th:text="#{${'theme.' + t}}">Animals</span>
                    </a>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
