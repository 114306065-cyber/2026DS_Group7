<!--
  Hand-drawn SVG illustrations for the theme cards and page decorations.
  Background colours use CSS classes (sky, hill, mountain...) so they follow the light and dark themes.
-->

<!--
  Theme card scenes. Each scene fills the whole card (viewBox 400 x 150) and is anchored to the right,
  so the theme name sits on the open sky on the left.
  Sky, cloud and far-hill colours come from CSS variables (--ill-*) so they follow the light and dark themes.
  Gradient ids are prefixed with the theme name because all six scenes share one page.
-->
