about.title=關於 MovieFinder
about.lead=MovieFinder 是一個主題式電影搜尋引擎。輸入 cat、cooking、friendship 這類主題，就能找到相關的電影網站，即使你還不知道任何片名。
about.how.title=排名方式
about.how.step1=為查詢補上電影相關字詞，透過 Tavily 找出候選網站。
about.how.step2=爬取每個網站和最多五個子網頁，建立成一棵樹。
about.how.step3=計算每個網頁的關鍵字次數並計分：每個關鍵字的次數 × 權重。
about.how.step4=從樹的底部往上，把子網頁分數的一半加到上一層。
about.how.step5=用 QuickSort 依網站總分排序。
about.source.title=資料來源
about.source.body=搜尋結果來自 Tavily Search API。Google 自 2026 年起不再開放新用戶申請搜尋 API，因此課程改用 Tavily。
about.team.title=團隊
about.team.body=政治大學 2026 年秋季資料結構 第 7 組。
