about.title=關於 MovieFinder
about.lead=MovieFinder 是一個以主題為核心的電影搜尋引擎。使用者只需要輸入感興趣的關鍵字，即使不知道電影名稱，也能探索與該主題相關的電影網站，發現更多值得觀看的作品。
about.how.title=搜尋與排名方式
about.how.lead=MovieFinder 不只提供搜尋結果，還會透過自訂的關鍵字評分機制，重新排序相關網站，讓搜尋結果更符合使用者的興趣。
about.how.step1.label=主題搜尋
about.how.step1=將使用者輸入的關鍵字搭配電影相關詞彙，透過 Tavily Search API 取得候選網站。
about.how.step2.label=網站分析
about.how.step2=擷取每個網站的主要網頁及最多五個直接子網頁，建立網站樹狀結構（WebTree）。
about.how.step3.label=關鍵字計分
about.how.step3=統計各網頁中關鍵字的出現次數，並根據不同權重計算網頁分數。
about.how.step4.label=網站總分
about.how.step4=由子節點往上彙整分數，將子網頁分數的 50% 納入主網頁的總分。
about.how.step5.label=結果排序
about.how.step5=使用 QuickSort 演算法，依網站總分由高至低排列搜尋結果。
about.source.title=資料來源
about.source.body=MovieFinder 使用 Tavily Search API 取得候選網站的搜尋結果，再分析網頁內容與子網頁連結，透過自訂的評分演算法重新排名。
about.source.note=由於 Google 的 Custom Search JSON API 已停止接受新用戶申請，本專案依照課程建議改用 Tavily 作為搜尋資料來源。
